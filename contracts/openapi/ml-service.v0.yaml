openapi: 3.0.3
info:
  title: S.A.P.I. ML Service (Modelo D)
  version: 0.1.0
  description: |
    Contrato v0 del servicio ML interno de S.A.P.I. v2 (FastAPI, ADR-002).
    Su único cliente es el backend Spring Boot (`backend.v0.yaml`); no es una
    API pública.

    - Ejecuta el Modelo D sobre la grilla completa (`score_current_grid()`).
    - Las features se resuelven dentro del servicio desde los stores
      versionados FIRMS/DMC. El cliente nunca envía features.
    - El score es un ranking relativo entre las 50 celdas de una misma
      evaluación. No es una probabilidad calibrada de incendio
      (`scientific_model_validation=false`).

    Contract-first (SAPI-56): SAPI-55 implementa este documento. Después del
    checkpoint del contrato solo se admiten cambios compatibles, y los
    clientes deben ignorar campos desconocidos en las respuestas.
servers:
  - url: http://localhost:8000
    description: Servicio ML local
tags:
  - name: health
  - name: ranking
paths:
  /health:
    get:
      tags: [health]
      operationId: getMlHealth
      summary: Estado del servicio ML y versión del modelo
      description: Chequeo barato; nunca ejecuta inferencia.
      responses:
        '200':
          description: Modelo disponible para puntuar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlHealth'
              example:
                status: ok
                model_version: prototype_model_d_v1
        '503':
          description: Modelo o metadata no disponibles; el servicio no puede puntuar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MlHealth'
              example:
                status: degraded
                model_version: null
  /predict:
    post:
      tags: [ranking]
      operationId: predictRanking
      summary: Ranking relativo de las 50 celdas
      description: |
        Puntúa la grilla completa con el Modelo D. Sin `forecast_time` usa el
        último bucket con lectura meteorológica real; nunca inventa
        meteorología futura. Un `forecast_time` posterior a la última lectura
        real responde 503 `prototype_unavailable`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
            examples:
              latest:
                summary: Último bucket real disponible
                value: {}
              explicit:
                summary: forecast_time explícito
                value:
                  forecast_time: '2026-10-01T18:00:00-03:00'
      responses:
        '200':
          description: Evaluación válida con exactamente 50 celdas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResult'
              examples:
                synthetic:
                  $ref: '#/components/examples/RankingResultSynthetic'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ScoringUnavailable'
components:
  schemas:
    PredictRequest:
      type: object
      additionalProperties: false
      description: |
        Única entrada admitida. No se aceptan features ni otros campos: el
        servicio las resuelve desde los stores versionados.
      properties:
        forecast_time:
          type: string
          format: date-time
          description: Hora T de evaluación, ISO 8601 con zona horaria. Opcional.
    RankingResult:
      type: object
      description: |
        Resultado de una evaluación válida. Lo comparten `POST /predict`
        (servicio ML) y `GET /api/v1/ranking` (backend), que lo reexpone sin
        reordenar ni reformatear. Los nombres de campo son los de
        `sapi-output-v1`.
      required:
        - schema_version
        - model_version
        - forecast_time
        - inputs_fingerprint
        - score_semantics
        - scientific_model_validation
        - cells
      properties:
        schema_version:
          type: string
          enum: [sapi-ranking-v0]
          description: Versión de este schema.
        model_version:
          type: string
          minLength: 1
          description: Versión del artefacto del Modelo D que puntuó.
        forecast_time:
          type: string
          format: date-time
          description: Hora T evaluada, con zona horaria.
        inputs_fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            sha256 canónico del manifest de insumos fijados de la corrida
            (modelo, FIRMS, DMC y topografía). Los mismos insumos producen el
            mismo fingerprint.
        score_semantics:
          type: string
          enum: [relative_rank]
          description: |
            El score solo ordena las celdas entre sí dentro de esta
            evaluación.
        scientific_model_validation:
          type: boolean
          enum: [false]
          description: |
            El Modelo D no tiene validación científica. Cambiar este valor
            requiere una nueva versión del contrato.
        horizon_hours:
          type: integer
          minimum: 1
          description: Horizonte del target del modelo, (T, T+horizon_hours]. Opcional.
        disclaimer:
          type: string
          description: Aviso para mostrar al usuario final. Opcional.
        cells:
          type: array
          minItems: 50
          maxItems: 50
          description: |
            Exactamente 50 celdas, en orden ascendente de `rank`. Invariantes
            que valida la implementación (JSON Schema no las expresa):
            - los `cell_id` son únicos y son exactamente VP-001..VP-050;
            - los `rank` forman 1..50, sin huecos ni repetidos;
            - `score` no crece al avanzar `rank`;
            - `display_rank` = 1 + número de celdas con score mayor;
            - `tie_group_size` = número de celdas con exactamente el mismo score.
          items:
            $ref: '#/components/schemas/CellRanking'
    CellRanking:
      type: object
      required: [cell_id, score, rank, display_rank, tie_group_size]
      properties:
        cell_id:
          type: string
          pattern: '^VP-\d{3}$'
          description: Identificador de la celda de 1 km² (VP-001..VP-050).
        score:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Score relativo del Modelo D en [0, 1]. Solo es comparable entre
            celdas de la misma evaluación; no es una probabilidad calibrada de
            incendio.
        rank:
          type: integer
          minimum: 1
          maximum: 50
          description: |
            Posición única 1..50. El orden del servicio es la autoridad: los
            consumidores no reordenan.
        display_rank:
          type: integer
          minimum: 1
          maximum: 50
          description: |
            Posición para mostrar. Las celdas empatadas comparten el menor
            rank del grupo (método min).
        tie_group_size:
          type: integer
          minimum: 1
          maximum: 50
          description: Celdas que comparten exactamente este score (1 = sin empate).
    MlHealth:
      type: object
      required: [status, model_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        model_version:
          type: string
          nullable: true
          description: Versión del modelo cargado; null si no está disponible.
    Error:
      type: object
      required: [status, error_type, message]
      properties:
        status:
          type: string
          enum: [error]
        error_type:
          type: string
          description: |
            Tipo de error. Valores conocidos en v0:
            - `invalid_request` (422): la petición no cumple el contrato.
            - `prototype_unavailable` (503): falta o no es legible un insumo
              fijado, no hay meteorología real para el `forecast_time`
              pedido, o FIRMS está demasiado desfasado.
            - `data_unavailable` (503): el contenido de un insumo legible está
              corrupto.
            - `internal_error` (500): error inesperado, o un resultado que no
              cumple este contrato. Nunca se rellena con celdas vacías ni
              scores por defecto.
            - `upstream_invalid_response` (502, backend): el servicio ML
              respondió algo que no cumple el contrato.
            - `upstream_unavailable` (503, backend): el servicio ML no está
              accesible.
            - `upstream_timeout` (504, backend): el servicio ML no respondió a
              tiempo.
            La lista es abierta: ante un valor desconocido, el cliente se guía
            por el código HTTP.
        message:
          type: string
          description: Mensaje legible. Nunca expone detalles internos.
  responses:
    InvalidRequest:
      description: La petición no cumple el contrato (por ejemplo, un campo no admitido).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error_type: invalid_request
            message: La petición incluye campos no admitidos o un forecast_time inválido.
    InternalError:
      description: Error inesperado o resultado que no cumple el contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            error_type: internal_error
            message: Error interno al generar el ranking.
    ScoringUnavailable:
      description: No se puede puntuar con los insumos disponibles.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            prototype_unavailable:
              value:
                status: error
                error_type: prototype_unavailable
                message: No hay lectura meteorológica real para el forecast_time solicitado.
            data_unavailable:
              value:
                status: error
                error_type: data_unavailable
                message: Insumo de datos no disponible o ilegible.
  examples:
    RankingResultSynthetic:
      summary: Ejemplo sintético ilustrativo (no es una corrida real)
      description: |
        Valores inventados solo para ilustrar la forma del contrato. Las
        celdas de rank 3 y 4 empatan (display_rank 3, tie_group_size 2).
