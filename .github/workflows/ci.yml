# S.A.P.I. - CI veraz (Quality Gate W0.9, decisión H11, Revisión 3 §3.1).
#
# GitHub Actions es el MERGE GATE preferido, no una dependencia dura: cada job
# invoca scripts/merge_gate.py, el mismo runner del fallback (nube sin Docker o
# Windows/Omen con Docker), con los mismos criterios y el mismo formato de
# evidencia. El gate usa el run de `push` sobre el SHA head.
#
# Notas:
# - `push` en todas las ramas (no tags): corre sin PR, también en ramas apiladas.
# - `workflow_dispatch` solo aparece una vez que este archivo está en `main`.
# - Lint bloqueante solo en rutas v2; la deuda legacy se reporta (no bloquea).
# - sql-migration-validation = SQL MIGRATION VALIDATION (psql), NO es Flyway.
#   flyway-integration = REAL FLYWAY INTEGRATION VALIDATION (Flyway CLI 12.4.0).
# - El job e2e se agrega con PR-6 (SAPI-66), cuando exista la prueba.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/merge_gate.py --job freeze
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-freeze-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/merge_gate.py --job python
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-python-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate

  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/backend/pom.xml
      - run: python3 scripts/merge_gate.py --job backend-unit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-backend-unit-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate

  sql-migration-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/merge_gate.py --job sql-migration-validation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-sql-migration-validation-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate

  flyway-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/merge_gate.py --job flyway-integration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-flyway-integration-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/merge_gate.py --job container-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-container-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/sapi-gate
