[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[client]
showSidebarNavigation = false

# Estos cuatro colores están duplicados a propósito: Streamlit lee este bloque
# al arrancar, antes de que corra Python, así que no puede importarlos de
# `app/theme/tokens.py`. Ese módulo es la fuente única y
# `tests/test_theme.py::test_theme_config_matches_tokens` falla si los dos se
# desincronizan — no edites acá sin editar allá.
#
# secondaryBackgroundColor queda neutro (no navy) porque Streamlit lo aplica
# también a fondos de widgets fuera del sidebar; el navy del sidebar se aplica
# aparte vía CSS, acotado con un selector.
[theme]
base = "light"
primaryColor = "#3b6ea5"
backgroundColor = "#faf9f6"
secondaryBackgroundColor = "#f4f1ea"
textColor = "#20242b"
font = "sans serif"
