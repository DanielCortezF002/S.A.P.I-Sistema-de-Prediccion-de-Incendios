# Arquitectura v2 (SAPI-60, ADR-004/008/009). `docker compose up --build` levanta
# solo db-v2 (PostGIS, 5432), ml-api (FastAPI + Modelo D, 8000) y backend
# (Spring Boot, 8080). Los servicios de Hito 1 quedan fuera de la ruta v2 con
# profiles: `legacy` (db-postgis, analytics-backend, web-presentation) y `ops`
# (n8n-bridge). Configuración en .env (copiar .env.example); ver README.
services:
  db-v2:
    # Base v2 aislada del legacy (H4, ADR-008): volumen propio, sin
    # docker/initdb. El esquema lo crea Flyway desde el backend (V001-V003).
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${SAPI_DB_USER:-sapi}
      POSTGRES_PASSWORD: ${SAPI_DB_PASSWORD:?Definir SAPI_DB_PASSWORD en .env (copiar .env.example)}
      POSTGRES_DB: ${SAPI_DB_NAME:-sapi_v2}
    ports:
      - "127.0.0.1:${SAPI_DB_PORT:-5432}:5432"
    volumes:
      - sapi_v2_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: el servidor temporal que usa la imagen durante la
      # inicialización solo escucha en el socket Unix, así que este check no
      # pasa hasta que la base acepta conexiones de red de verdad.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - sapi-net

  ml-api:
    # Modo reproducible por defecto (ADR-009): puntúa con el Modelo D
    # versionado y el snapshot real congelado de Hito 1
    # (artifacts/hito1/reproducibility, dentro de la imagen), forecast_time
    # 2026-09-01T00:00Z. No es una corrida diaria operacional.
    build:
      context: .
      dockerfile: Dockerfile.ml-api
    environment:
      SAPI_REPRODUCIBILITY_MODE: "1"
    ports:
      - "127.0.0.1:${SAPI_ML_PORT:-8000}:8000"
    healthcheck:
      # GET /health devuelve 200 solo si el modelo y su metadata se leen
      # (503 si no); urlopen falla con cualquier código >= 400.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - sapi-net

  backend:
    # Llega al ML y a la base por nombre de servicio, nunca por localhost.
    # Flyway corre al arrancar sobre db/migration montado en solo lectura
    # (ADR-008); el servidor HTTP abre solo si las migraciones terminan bien.
    build:
      context: ./services/backend
    environment:
      SAPI_ML_BASE_URL: http://ml-api:8000
      SAPI_ML_CONNECT_TIMEOUT: ${SAPI_ML_CONNECT_TIMEOUT:-2s}
      SAPI_ML_READ_TIMEOUT: ${SAPI_ML_READ_TIMEOUT:-60s}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-v2:5432/${SAPI_DB_NAME:-sapi_v2}
      SPRING_DATASOURCE_USERNAME: ${SAPI_DB_USER:-sapi}
      SPRING_DATASOURCE_PASSWORD: ${SAPI_DB_PASSWORD:?Definir SAPI_DB_PASSWORD en .env (copiar .env.example)}
      SAPI_PERSISTENCE_ENABLED: "true"
      SAPI_FLYWAY_LOCATIONS: filesystem:/app/db/migration
    volumes:
      - ./db/migration:/app/db/migration:ro
    ports:
      - "127.0.0.1:${SAPI_BACKEND_PORT:-8080}:8080"
    depends_on:
      db-v2:
        # Flyway necesita la base al arrancar.
        condition: service_healthy
      ml-api:
        # Solo orden de arranque: el backend no llama al ML al iniciar y, si
        # el ML no responde, devuelve 503/504 controlados (SAPI-57).
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - sapi-net

  db-postgis:
    profiles: ["legacy"]
    image: postgis/postgis:15-3.4
    container_name: sapi-db-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sapi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sapi_db}
    ports:
      - "5432:5432"
    volumes:
      - sapi_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sapi} -d ${POSTGRES_DB:-sapi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sapi-net

  analytics-backend:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: sapi-analytics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sapi}:${POSTGRES_PASSWORD:-sapi_secret}@db-postgis:5432/${POSTGRES_DB:-sapi_db}
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-sapi}:${POSTGRES_PASSWORD:-sapi_secret}@db-postgis:5432/${POSTGRES_DB:-sapi_db}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      db-postgis:
        condition: service_healthy
    networks:
      - sapi-net

  web-presentation:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sapi-web
    restart: unless-stopped
    # Sin env_file (SAPI-70): el dashboard no usa credenciales de APIs
    # externas (NASA FIRMS, DMC, OpenTopography) -- Model D solo lee
    # archivos locales. Solo recibe la URL de la base de datos.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sapi}:${POSTGRES_PASSWORD:-sapi_secret}@db-postgis:5432/${POSTGRES_DB:-sapi_db}
      DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER:-sapi}:${POSTGRES_PASSWORD:-sapi_secret}@db-postgis:5432/${POSTGRES_DB:-sapi_db}
    ports:
      - "8501:8501"
    volumes:
      # ./data agregado 09-09-2026 (auditoria arquitectura 4+1, ver
      # docs/architecture-4plus1-hito1.md, Vista Fisica): sin este montaje,
      # web-presentation (el unico servicio que sirve app/app.py, modo
      # Prototipo por defecto) no tenia acceso a data/raw ni data/processed
      # -- score_current_grid() en MODO NORMAL habria fallado con
      # PrototypeUnavailableError dentro de este contenedor. analytics-backend
      # ya montaba ./data; web-presentation no, pese a ser el servicio que
      # realmente ejecuta la ruta de inferencia. En SAPI_REPRODUCIBILITY_MODE=1
      # no hace falta (usa artifacts/hito1/reproducibility/, ya incluido en
      # la imagen via .dockerignore) -- este mount cubre el modo normal.
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db-postgis:
        condition: service_healthy
    networks:
      - sapi-net

  n8n-bridge:
    # Puente HTTP local de desarrollo para que n8n consulte Model D via
    # score_current_grid() -- NO es el servicio FastAPI de la arquitectura
    # objetivo (ver tools/n8n_bridge/app.py, ADR-002). Publicado SOLO en
    # 127.0.0.1 -- nunca cambiar a 0.0.0.0 sin decision explicita, ver
    # docs de la propuesta de integracion n8n. n8n (en su propio contenedor)
    # lo alcanza via http://host.docker.internal:8600.
    # Sin env_file (SAPI-70/SAPI-71): no necesita credenciales. Sin
    # /var/run/docker.sock ni DOCKER_HOST: el puente nunca controla Docker.
    # data/ y models/ en solo lectura: solo puntua, no ingiere ni reentrena.
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile.n8n-bridge
    container_name: sapi-n8n-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    networks:
      - sapi-net

volumes:
  # Base legacy de Hito 1 (profile legacy). La ruta v2 no la usa (H4).
  sapi_pgdata:
  # Base v2 (SAPI-60). Ojo: `docker compose down -v` borra TODOS los volúmenes
  # de este archivo (también sapi_pgdata, aunque su profile no esté activo).
  # Para reiniciar solo la base v2: `docker compose down` y luego
  # `docker volume rm <proyecto>_sapi_v2_pgdata` (ver README).
  sapi_v2_pgdata:

networks:
  sapi-net:
    driver: bridge