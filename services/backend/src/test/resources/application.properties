# Surefire: defaults ML + exclusión JDBC/Flyway (sin Docker).
# Perfil "it" (failsafe) anula spring.autoconfigure.exclude y habilita persistencia real.
spring.application.name=sapi-backend
server.port=${SERVER_PORT:8080}

sapi.ml.base-url=${SAPI_ML_BASE_URL:http://localhost:8000}
sapi.ml.connect-timeout=${SAPI_ML_CONNECT_TIMEOUT:2s}
sapi.ml.read-timeout=${SAPI_ML_READ_TIMEOUT:60s}

# Sin DataSource en surefire: beans JDBC reales off; no-op via TestRankingPersistenceAutoConfiguration.
sapi.persistence.enabled=false

spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration,\
org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
