spring.application.name=sapi-backend
# Configuración por variables de entorno; sin secretos en el repositorio.
server.port=${SERVER_PORT:8080}

# Servicio ML (SAPI-57, ADR-010). La lectura debe superar la duración del scoring.
sapi.ml.base-url=${SAPI_ML_BASE_URL:http://localhost:8000}
sapi.ml.connect-timeout=${SAPI_ML_CONNECT_TIMEOUT:2s}
sapi.ml.read-timeout=${SAPI_ML_READ_TIMEOUT:60s}

# PostgreSQL/PostGIS v2 (SAPI-59). Credenciales solo por entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sapi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sapi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway sobre db/migration canónico (ADR-008). Nunca baselineOnMigrate.
spring.flyway.locations=${SAPI_FLYWAY_LOCATIONS:filesystem:../../db/migration}
spring.flyway.validate-on-migrate=true
